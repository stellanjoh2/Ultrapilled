# Isso behind guestbook/gate.py. Secrets and per-environment values come from
# env vars in app.py — never commit SMTP passwords or the hash salt here.

[general]
dbpath = /data/guestbook.db
name = ultrapilled-guestbook
host = https://ultrapilled.com
max-age = 15m
notify = smtp
reply-notifications = false
gravatar = false
latest-enabled = false

[admin]
enabled = false

[moderation]
enabled = true
approve-if-email-previously-approved = false
purge-after = 30d

[server]
listen = http://0.0.0.0:8080
public-endpoint = https://guestbook.ultrapilled.com
samesite = Lax

[smtp]
host = smtp.resend.com
port = 465
security = ssl
username = resend
timeout = 10

[guard]
enabled = true
ratelimit = 1
direct-reply = 3
reply-to-self = false
require-author = true
require-email = false

[markup]
renderer = mistune
allowed-elements =
allowed-attributes =

[markup.mistune]
plugins =
parameters = escape, hard_wrap
