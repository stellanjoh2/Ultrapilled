<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Ultrapilled</title>
    <meta name="description" content="That page isn’t part of the Ultrapilled experience." />
    <meta name="robots" content="noindex" />
    <script>
      /* Share links use /r/<id>. GitHub Pages serves this 404 for that path —
         stash the id and boot the main app so Messenger can’t strip ?r=. */
      (function () {
        var m = location.pathname.match(/^\/r\/([A-Za-z0-9_-]{16,64})\/?$/);
        if (!m) return;
        try {
          sessionStorage.setItem("up-share-id", m[1]);
        } catch (e) {}
        location.replace("/" + location.search + location.hash);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Inter:wght@300;400;600;700&family=Libre+Baskerville:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="not-found-root"></div>
    <script type="module" src="/src/notFoundPage.ts"></script>
  </body>
</html>
