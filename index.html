<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/images/intropill.gif" as="image" />
    <link rel="preload" href="/media/Mode-Select-Static.webp" as="image" />
    <script>
      addEventListener(
        "error",
        (event) => {
          const el = event.target;
          if (!(el instanceof HTMLScriptElement) || !el.src.includes("/assets/")) return;
          if (sessionStorage.getItem("up-js-retry")) return;
          sessionStorage.setItem("up-js-retry", "1");
          fetch("/", { cache: "reload" }).finally(() => location.reload());
        },
        true,
      );
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultrapilled</title>
    <meta name="description" content="A physics playground for text chips and icons." />

      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Bricolage+Grotesque:ital,opsz,wght@0,12..96,200..800;1,12..96,200..800&family=DM+Serif+Display:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600;1,700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400;1,700&family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Sora:wght@100..800&family=Space+Grotesk:wght@600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Syne:wght@400..800&display=swap"
